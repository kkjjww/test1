<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华尔街见闻</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; cursor: crosshair; }
        canvas { display: block; }
    </style>
</head>
<body>



<div class="kcon">
		<div>华尔街见闻</div>
		<div  x-data="{ nlist:[],fetchurls() { fetch('https://api-one.wallstcn.com/apiv1/content/articles/hot?period=all').then(response => response.json()).then(data => this.nlist = data.data.day_items); } }"   >

			<template x-for="(item) in nlist"  x-init="fetchurls">
		
				<li class="item" :id="item.link">
					<h3><a :href="item.uri" x-text="item.title" target="_blank"></a></h3>
				
					<div class="item-c" ><p><span  x-text="formatTimeStamp(item.display_time)"></span></p></div>
				</li>
			
			</template>
		
		</div>
	</div>
 <script defer src="alpinejs.min.js" defer></script>
